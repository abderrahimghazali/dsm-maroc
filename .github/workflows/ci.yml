name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate docs registry
        run: pnpm registry
      - name: Type-check
        run: npx tsc --noEmit -p .
      - name: Lint
        run: pnpm lint
      - name: CLI tests
        run: pnpm test
      - name: Build docs site
        run: pnpm build
